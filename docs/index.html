ion s(e,t,n,r,i){let a=e.get(n);if(a!==void 0)throw new o(i,t,n,a,r);e.set(n,r)}function c(e,n){if(!Array.isArray(e))throw new t(n,-1,`<payload>`,`expected an array, received ${typeof e}`);let r=new Map,i=new Map,o=[];for(let t=0;t<e.length;t+=1){let c=a(e[t],t,n);s(r,`id`,c.id,t,n),s(i,`en`,`${c.subject}:${c.en.toLowerCase()}`,t,n),o.push(c)}return o}var l=[{id:`biochem-0001`,subject:`biochem`,en:`alpha-amino acid`,cn:`α-氨基酸`,defCn:`分子中氨基和羧基连接在同一个碳原子（即α-碳原子）上的氨基酸，是构成蛋白质的基本单位。除甘氨酸外，其α-碳原子都是手性碳原子，故具有旋光性。`,topic:`蛋白质的结构与功能`,note:``},{id:`biochem-0002`,subject:`biochem`,en:`peptide plane`,cn:`肽平面`,defCn:`蛋白质分子中由肽键及其两侧的两个α-碳原子共同构成的刚性平面结构。由于肽键具有部分双键性质而不能自由旋转，与肽键相连的C、O、N、H四个原子和两个α-碳原子共处同一平面。`,topic:`蛋白质的结构与功能`,note:`与"肽键"区分：肽键是C—N共价键，肽平面是包含该键的整个刚性平面。`},{id:`biochem-0003`,subject:`biochem`,en:`conformation`,cn:`构象`,defCn:`同一分子由于单键旋转而产生的、不改变共价键组成和构型的空间排列方式。蛋白质的构象决定其生物学功能，构象改变往往伴随功能改变。`,topic:`蛋白质的结构与功能`,note:`与"构型"区分：构型改变必须断键，构象改变只需单键旋转。`},{id:`biochem-0004`,subject:`biochem`,en:`hydrophobic interaction`,cn:`疏水相互作用`,defCn:`非极性分子或基团在水溶液中倾向于相互聚集、以减少与水的接触面积的作用力，是维持蛋白质三级结构的主要作用力之一，在蛋白质折叠中起决定性作用。`,topic:`蛋白质的结构与功能`,note:``},{id:`biochem-0005`,subject:`biochem`,en:`Michaelis constant`,cn:`米氏常数`,defCn:`酶促反应速度达到最大反应速度一半时的底物浓度，用Km表示，单位为浓度单位。Km是酶的特征性常数，其值越小表示酶与底物的亲和力越大。`,topic:`酶`,note:`要能写出米氏方程并说明Km的物理意义，简答题常与Vmax一起考。`},{id:`biochem-0006`,subject:`biochem`,en:`isozyme`,cn:`同工酶`,defCn:`催化相同的化学反应，但分子结构、理化性质和免疫学性质不同的一组酶。它们可存在于同一生物体的不同组织中，如乳酸脱氢酶有五种同工酶。`,topic:`酶`,note:``},{id:`biochem-0007`,subject:`biochem`,en:`allosteric enzyme and allosteric effect`,cn:`别构酶和别构效应`,defCn:`别构酶是指含有多个亚基、除活性中心外还含别构中心的酶；别构效应是指效应物与别构中心以非共价方式结合后引起酶分子构象改变，从而改变其催化活性的现象，其动力学曲线呈S形。`,topic:`酶`,note:`答题时分两部分写：先定义别构酶，再定义别构效应。`},{id:`biochem-0008`,subject:`biochem`,en:`glycosidic bond`,cn:`糖苷键`,defCn:`一个单糖分子上半缩醛羟基的氢原子与另一分子上羟基（或氨基）的氢原子脱水缩合形成的共价键，是连接单糖构成寡糖和多糖的化学键。`,topic:`糖类代谢`,note:``},{id:`biochem-0009`,subject:`biochem`,en:`glycoconjugate`,cn:`糖缀合物`,defCn:`糖类与蛋白质、脂质等非糖物质以共价键结合形成的复合物，主要包括糖蛋白、蛋白聚糖和糖脂等，在细胞识别、免疫应答、信号传递和物质运输中发挥重要作用。`,topic:`糖类代谢`,note:``},{id:`biochem-0010`,subject:`biochem`,en:`glycolysis`,cn:`糖酵解`,defCn:`葡萄糖在细胞质中经十步酶促反应分解为丙酮酸、并净生成2分子ATP和2分子NADH的过程。该途径不需要氧参与，有3个关键酶，是所有生物共有的糖分解途径。`,topic:`糖类代谢`,note:`2025年与2026年连续考过。三个关键酶（己糖激酶、磷酸果糖激酶-1、丙酮酸激酶）是常见得分点。`},{id:`biochem-0011`,subject:`biochem`,en:`gluconeogenesis`,cn:`糖异生`,defCn:`由非糖物质（乳酸、甘油、生糖氨基酸等）转变为葡萄糖或糖原的过程，主要在肝脏和肾脏中进行。因糖酵解的三个不可逆反应需要由另外的酶绕过，故糖异生并不是糖酵解的简单逆转。`,topic:`糖类代谢`,note:`常与糖酵解对比考，注意答出四个糖异生特有的关键酶。`},{id:`biochem-0012`,subject:`biochem`,en:`tricarboxylic acid cycle`,cn:`三羧酸循环`,defCn:`乙酰CoA在线粒体中经柠檬酸合成、两次氧化脱羧和四次脱氢等反应彻底氧化为CO2，并生成NADH、FADH2和GTP的循环途径。它是糖、脂和蛋白质代谢的最终共同通路。`,topic:`糖类代谢`,note:`又称柠檬酸循环或Krebs循环。与"乙醛酸循环"区分：后者绕过两次脱羧，可净生成琥珀酸。`},{id:`biochem-0013`,subject:`biochem`,en:`pentose phosphate pathway`,cn:`磷酸戊糖途径`,defCn:`葡萄糖在细胞质中先经氧化阶段生成NADPH和5-磷酸核糖，再经非氧化阶段的基团转移反应实现磷酸戊糖相互转变的代谢途径，为生物合成提供还原力和核糖，与糖酵解在6-磷酸葡萄糖处分支。`,topic:`糖类代谢`,note:`答题要写出它的生物学意义：提供NADPH和5-磷酸核糖。`},{id:`biochem-0014`,subject:`biochem`,en:`glyoxylate cycle`,cn:`乙醛酸循环`,defCn:`存在于植物、微生物等生物中的一种变异的三羧酸循环途径，通过异柠檬酸裂合酶和苹果酸合酶两个关键酶绕过三羧酸循环中的两次脱羧反应，使乙酰CoA能够净生成琥珀酸，进而合成糖类。`,topic:`糖类代谢`,note:``},{id:`biochem-0015`,subject:`biochem`,en:`beta-oxidation of fatty acids`,cn:`脂肪酸的β-氧化`,defCn:`脂肪酸在体内氧化分解的主要方式，从脂肪酸的β-碳原子开始，依次经过脱氢、加水、再脱氢和硫解四步反复进行的反应，每轮从羧基端断下一个乙酰CoA，使碳链缩短两个碳原子。`,topic:`脂质代谢`,note:`常与脂肪酸合成对比考（场所、载体、辅酶、能量、酶系统）。`},{id:`biochem-0016`,subject:`biochem`,en:`ketone bodies`,cn:`酮体`,defCn:`脂肪酸在肝脏中氧化分解时产生并输出的乙酰乙酸、β-羟丁酸和丙酮三种中间产物的统称，是肝脏向肝外组织输送能量的形式，肝脏自身缺乏利用酮体的酶。`,topic:`脂质代谢`,note:`答题要写出三种分子，并说明"肝内生酮、肝外利用"这一特点。`},{id:`biochem-0017`,subject:`biochem`,en:`respiratory chain`,cn:`呼吸链`,defCn:`又称电子传递链，是位于线粒体内膜上、由复合体Ⅰ至Ⅳ等一组电子传递体按氧化还原电位由低到高排列组成的链式反应体系，将代谢物脱下的氢和电子依次传递给氧生成水，同时释放能量供ATP合成。`,topic:`生物氧化`,note:``},{id:`biochem-0018`,subject:`biochem`,en:`oxidative phosphorylation`,cn:`氧化磷酸化`,defCn:`代谢物脱下的氢经呼吸链氧化传递时逐步释放能量，驱动ADP与无机磷酸结合生成ATP的过程，是需氧生物合成ATP的主要方式，可用化学渗透学说解释其机制。`,topic:`生物氧化`,note:`2022年与2023年连续考过。注意与底物水平磷酸化区分。`},{id:`biochem-0019`,subject:`biochem`,en:`pyruvate dehydrogenase complex`,cn:`丙酮酸脱氢酶系`,defCn:`位于线粒体内膜上、催化丙酮酸氧化脱羧生成乙酰CoA的多酶复合体，由丙酮酸脱氢酶、二氢硫辛酰转乙酰酶和二氢硫辛酸脱氢酶三种酶以及焦磷酸硫胺素等五种辅酶组成，是不可逆反应的限速环节。`,topic:`糖类代谢`,note:`注意答出三种酶和五种辅酶，这是常见的采分点。`},{id:`biochem-0020`,subject:`biochem`,en:`salvage pathway of nucleotide synthesis`,cn:`核苷酸的补救合成`,defCn:`利用体内游离的碱基或核苷，经酶催化直接转变为相应核苷酸的途径，不需要从头合成那样消耗大量能量和氨基酸前体，可节省原料与能量，是脑、骨髓等组织合成核苷酸的主要方式。`,topic:`核苷酸代谢`,note:`2023年与2025年都考过。与"从头合成"相对。`},{id:`biochem-0021`,subject:`biochem`,en:`carbamoyl phosphate synthetase I`,cn:`氨甲酰磷酸合成酶Ⅰ`,defCn:`存在于肝细胞线粒体中的酶，以氨、二氧化碳和ATP为底物合成氨甲酰磷酸，是尿素循环的限速酶和第一个调控位点，其活性受N-乙酰谷氨酸的别构激活。`,topic:`氨基酸代谢`,note:`与尿素循环直接相关，注意与利用谷氨酰胺的Ⅱ型区分。`},{id:`biochem-0022`,subject:`biochem`,en:`Bohr effect`,cn:`波尔效应`,defCn:`血液pH降低或二氧化碳分压升高时，血红蛋白对氧的亲和力下降、氧解离曲线右移的现象。其生理意义在于使代谢旺盛的组织在酸性环境中获取更多的氧气。`,topic:`蛋白质的结构与功能`,note:`常与"协同效应""别构效应"一起出现在论述题中。`},{id:`biochem-0023`,subject:`biochem`,en:`Peptide bond`,cn:`肽键`,defCn:`一个氨基酸的α-羧基与另一个氨基酸的α-氨基脱去一分子水后形成的酰胺键，具有部分双键性质而不能自由旋转，是连接氨基酸构成多肽链和蛋白质的主要共价键。`,topic:`蛋白质的结构与功能`,note:`与"肽平面"区分：肽键是那个C—N共价键，肽平面是包含它的整个刚性平面。`},{id:`biochem-0024`,subject:`biochem`,en:`Protein denaturation`,cn:`蛋白质变性`,defCn:`蛋白质受到高温、极端pH、有机溶剂、尿素或去垢剂等理化因素影响时，其空间构象被破坏，理化性质和生物学活性随之改变或丧失，但一级结构（肽键）并未断裂。`,topic:`蛋白质的结构与功能`,note:`2025年简答题考过"高温、极端pH、除垢剂、尿素诱导变性的原理分别是什么"——关键得分点是各因素破坏的作用力不同。`},{id:`biochem-0025`,subject:`biochem`,en:`Quaternary structure`,cn:`蛋白质四级结构`,defCn:`由两条或两条以上具有三级结构的多肽链（亚基）通过非共价键聚合而成的特定空间排布方式，是蛋白质最高层次的结构，血红蛋白是典型例子。`,topic:`蛋白质的结构与功能`,note:`注意四级结构中各亚基单独存在时通常无活性，聚合后才表现生物学功能。`},{id:`biochem-0026`,subject:`biochem`,en:`Isoelectric point`,cn:`等电点`,defCn:`氨基酸或蛋白质分子所带正负电荷恰好相等、净电荷为零时溶液的pH值，此时分子在电场中不移动，溶解度最低，常用于蛋白质的分离纯化。`,topic:`蛋白质的结构与功能`,note:`2025年判断题涉及"pH3.0时所有氨基酸都带正电"，需理解等电点与电荷的关系。`},{id:`biochem-0027`,subject:`biochem`,en:`Active site`,cn:`酶的活性中心`,defCn:`酶分子中直接与底物结合并催化底物发生化学反应的特定区域，由结合部位和催化部位组成，通常只占酶分子很小的部分，其三维构象决定酶的专一性。`,topic:`酶`,note:`与别构中心区分：别构中心位于活性中心之外，结合效应物后通过构象变化间接调节酶活性。`},{id:`biochem-0028`,subject:`biochem`,en:`Cofactor`,cn:`辅助因子`,defCn:`酶催化活性所必需的、本身为小分子有机物或金属离子的非蛋白质成分，与酶蛋白结合构成全酶，其中与酶蛋白共价结合较牢固的称为辅基，结合疏松的称为辅酶。`,topic:`酶`,note:`全酶＝酶蛋白＋辅助因子，只有二者结合时才具有催化活性。`},{id:`biochem-0029`,subject:`biochem`,en:`Coenzyme A`,cn:`辅酶A`,defCn:`由泛酸、腺嘌呤、核糖和磷酸组成的辅酶，其巯基可与酰基结合形成硫酯键，是酰基转移反应中最重要的辅酶，如携带乙酰基生成乙酰CoA进入三羧酸循环。`,topic:`酶`,note:`缩写 CoA。丙酮酸脱氢酶系、三羧酸循环、脂肪酸氧化都依赖它。`},{id:`biochem-0030`,subject:`biochem`,en:`Michaelis-Menten equation`,cn:`米氏方程`,defCn:`描述酶促反应初速度与底物浓度关系的方程 v＝Vmax[S]/(Km+[S])，其中Km为米氏常数、Vmax为最大反应速度，可用于判断酶与底物的亲和力以及抑制作用类型。`,topic:`酶`,note:`2025年简答题考过"写出米氏方程并说明Km的意义"，必须能默写。`},{id:`biochem-0031`,subject:`biochem`,en:`Competitive inhibition`,cn:`竞争性抑制`,defCn:`抑制剂结构与底物相似，与底物竞争酶的活性中心，从而阻碍底物与酶结合的一类可逆抑制。其特点是增大底物浓度可解除抑制，Km增大而Vmax不变。`,topic:`酶`,note:`与非竞争性抑制对比记：非竞争性抑制剂的Km不变、Vmax减小，增加底物浓度无法解除。`},{id:`biochem-0032`,subject:`biochem`,en:`Feedback inhibition`,cn:`反馈抑制`,defCn:`代谢途径的终产物反过来抑制该途径中第一个关键酶（通常是限速酶）的活性，从而避免终产物过度积累的调节方式，多属于别构调节。`,topic:`酶`,note:``},{id:`biochem-0033`,subject:`biochem`,en:`Rate-limiting enzyme`,cn:`限速酶`,defCn:`在一条代谢途径中催化反应速度最慢、决定整条途径总速度的酶，通常催化不可逆反应，是代谢调节的主要作用位点，如糖酵解中的磷酸果糖激酶-1。`,topic:`酶`,note:`又称关键酶、调节酶。答各代谢途径调节时，写出限速酶是基本得分点。`},{id:`biochem-0034`,subject:`biochem`,en:`Specific activity`,cn:`比活性`,defCn:`每毫克蛋白质所含的酶活力单位数，是衡量酶制剂纯度的指标。在分离纯化过程中，比活性越高说明酶越纯，总蛋白减少而总活力保持则纯化效果好。`,topic:`酶`,note:`2023年论述题给出了纯化步骤数据，要求计算各步骤比活性并判断最有效步骤。`},{id:`biochem-0035`,subject:`biochem`,en:`Gel filtration`,cn:`凝胶过滤`,defCn:`又称分子筛层析，利用凝胶颗粒的网孔按分子大小分离蛋白质的技术：大分子不能进入网孔而先流出，小分子可进入网孔而路径长、后流出。`,topic:`酶`,note:`2023年论述题问过"凝胶过滤对该酶纯化是否有效，为什么"——关键是分辨它按分子大小而非按活性分离。`},{id:`biochem-0036`,subject:`biochem`,en:`Transamination`,cn:`转氨基作用`,defCn:`在转氨酶催化下，一种氨基酸的α-氨基转移到另一种α-酮酸的酮基上，生成新的氨基酸和新的α-酮酸的反应，是氨基酸分解代谢和合成非必需氨基酸的共同途径。`,topic:`氨基酸代谢`,note:`需要磷酸吡哆醛作为辅酶，注意不要与需要四氢叶酸的一碳单位转移混淆（2025年判断题的陷阱）。`},{id:`biochem-0037`,subject:`biochem`,en:`Oxidative deamination`,cn:`氧化脱氨基作用`,defCn:`氨基酸在酶催化下脱去氨基并伴随氧化反应生成α-酮酸和氨的过程，其中谷氨酸脱氢酶催化的反应是可逆的，是体内氨的主要来源。`,topic:`氨基酸代谢`,note:`与转氨基作用区分：氧化脱氨基真正释放出游离氨，转氨基只是氨基的转移。`},{id:`biochem-0038`,subject:`biochem`,en:`Urea cycle`,cn:`尿素循环`,defCn:`在肝细胞中进行的、将有毒的氨转变为无毒的尿素并排出体外的循环途径。过程包括氨甲酰磷酸的合成、瓜氨酸与天冬氨酸缩合生成精氨酸代琥珀酸、裂解产生精氨酸，最后精氨酸水解生成尿素和鸟氨酸。`,topic:`氨基酸代谢`,note:`2025年判断题涉及"哺乳动物可利用尿素循环解氨毒"。注意其中有两个氨基：一个来自游离氨，一个来自天冬氨酸。`},{id:`biochem-0039`,subject:`biochem`,en:`Essential amino acid`,cn:`必需氨基酸`,defCn:`人体自身不能合成或合成速度不能满足需要，必须由食物蛋白质供给的氨基酸，共有八种（儿童为九种），如赖氨酸、色氨酸、缬氨酸等。`,topic:`氨基酸代谢`,note:`与生糖、生酮氨基酸的分类容易混淆，注意区分两套分类体系。`},{id:`biochem-0040`,subject:`biochem`,en:`Glucogenic amino acid`,cn:`生糖氨基酸`,defCn:`在体内分解代谢后其碳骨架可通过丙酮酸或三羧酸循环中间产物转变为葡萄糖的氨基酸，绝大多数氨基酸都属于此类。`,topic:`氨基酸代谢`,note:`2024年论述题考过"哪些氨基酸与三羧酸循环中间物有关"。`},{id:`biochem-0041`,subject:`biochem`,en:`Ketogenic amino acid`,cn:`生酮氨基酸`,defCn:`在体内分解代谢后其碳骨架可转变为乙酰乙酸或乙酰CoA、进而生成酮体的氨基酸，包括亮氨酸和赖氨酸，另有部分氨基酸兼具生糖与生酮作用。`,topic:`氨基酸代谢`,note:`只生酮的只有亮氨酸和赖氨酸两种，是高频记忆点。`},{id:`biochem-0042`,subject:`biochem`,en:`Oxaloacetate`,cn:`草酰乙酸`,defCn:`三羧酸循环的起始底物和中间产物，由丙酮酸羧化生成，与乙酰CoA缩合生成柠檬酸进入循环，同时也是糖异生的重要前体。`,topic:`糖类代谢`,note:`2022年论述题考过"草酰乙酸参与的代谢过程"，需串起三羧酸循环、糖异生和转氨基作用。`},{id:`biochem-0043`,subject:`biochem`,en:`Citrate synthase`,cn:`柠檬酸合酶`,defCn:`催化三羧酸循环第一步反应、即乙酰CoA与草酰乙酸缩合生成柠檬酸和CoA的酶，是三羧酸循环的关键调节位点，其活性受ATP、NADH和柠檬酸抑制。`,topic:`糖类代谢`,note:`2023年判断题考过"柠檬酸合酶由底物和中间产物分别诱导的两次构象变化"。`},{id:`biochem-0044`,subject:`biochem`,en:`Glycogen phosphorylase`,cn:`糖原磷酸化酶`,defCn:`催化糖原分子中α-1,4-糖苷键磷酸解、使糖原逐步降解为1-磷酸葡萄糖的酶，是糖原分解的限速酶，受别构调节和可逆磷酸化双重调节。`,topic:`糖类代谢`,note:`2023年判断题考过"糖原分解和合成的限速酶及调节方式"。`},{id:`biochem-0045`,subject:`biochem`,en:`Cholesterol`,cn:`胆固醇`,defCn:`环戊烷多氢菲的衍生物，是动物细胞膜的重要组成成分，也是合成胆汁酸、类固醇激素和维生素D3的前体，其合成以乙酰CoA为原料、HMG-CoA还原酶为限速酶。`,topic:`脂质代谢`,note:`2025年简答题考过"胆固醇生物合成的四个步骤"。`},{id:`biochem-0046`,subject:`biochem`,en:`Fatty acid synthesis`,cn:`脂肪酸合成`,defCn:`在细胞质中以乙酰CoA为原料、经丙二酰CoA参与、由脂肪酸合酶催化反复进行缩合、还原、脱水、再还原四步反应逐步延长碳链的过程，以NADPH为供氢体、酰基载体蛋白为载体。`,topic:`脂质代谢`,note:`2024年论述题要求按场所、辅酶、载体、能量、方向、酶系统六个维度与β-氧化对比，是高频大题。`},{id:`biochem-0047`,subject:`biochem`,en:`Blood glucose`,cn:`血糖`,defCn:`血液中的葡萄糖，正常空腹浓度为3.9～6.1 mmol/L。其来源包括食物消化吸收、肝糖原分解和糖异生，去路包括氧化供能、合成糖原、转变为非糖物质和随尿排出。`,topic:`糖类代谢`,note:`2024年简答题考过"血糖的来源和去路及人体如何维持血糖恒定"。`},{id:`biochem-0048`,subject:`biochem`,en:`Lipoprotein`,cn:`脂蛋白`,defCn:`脂质与载脂蛋白结合形成的可溶性复合物，是血浆中脂质的运输形式，按密度由低到高可分为乳糜微粒、极低密度脂蛋白、低密度脂蛋白和高密度脂蛋白四类。`,topic:`脂质代谢`,note:`注意低密度脂蛋白与2023年细胞生物学真题中受体介导胞吞的联系。`},{id:`biochem-0049`,subject:`biochem`,en:`Adenosine triphosphate`,cn:`三磷酸腺苷`,defCn:`由腺嘌呤、核糖和三个磷酸基团组成的核苷酸，其末端两个磷酸酐键为高能键，水解时释放约30.5 kJ/mol的自由能，是细胞生命活动直接利用的能量货币。`,topic:`生物氧化`,note:`缩写 ATP。注意2023年判断题中"标准自由能变化30.5 kJ/mol"这一数值。`},{id:`biochem-0050`,subject:`biochem`,en:`Nicotinamide adenine dinucleotide`,cn:`烟酰胺腺嘌呤二核苷酸`,defCn:`由烟酰胺和腺嘌呤核苷酸组成的辅酶，作为脱氢酶的辅酶在氧化还原反应中传递氢和电子，其还原形式NADH是呼吸链中重要的电子供体。`,topic:`生物氧化`,note:`缩写 NAD+。与NADPH区分：NADH主要参与氧化供能，NADPH主要供还原性合成使用。`},{id:`biochem-0051`,subject:`biochem`,en:`Cytochrome`,cn:`细胞色素`,defCn:`一类以铁卟啉为辅基、通过铁离子的可逆氧化还原传递电子的色素蛋白，按吸收光谱分为a、b、c等几类，在呼吸链中依次排列传递电子。`,topic:`生物氧化`,note:`2026年简答题考过"生物氧化还原反应的几种电子载体"，细胞色素是其中之一。`},{id:`biochem-0052`,subject:`biochem`,en:`Chemiosmotic hypothesis`,cn:`化学渗透学说`,defCn:`由米切尔提出的解释氧化磷酸化机制的学说，认为电子沿呼吸链传递时释放的能量将质子从线粒体基质泵到膜间隙，形成跨内膜的质子电化学梯度，该梯度驱动ATP合酶合成ATP。`,topic:`生物氧化`,note:`与"结合变构机制"配合回答ATP的合成机制，是论述题的经典组合。`},{id:`biochem-0053`,subject:`biochem`,en:`Substrate-level phosphorylation`,cn:`底物水平磷酸化`,defCn:`在代谢物分子之间直接转移高能磷酸基团、使ADP磷酸化生成ATP的方式，不需要呼吸链和氧参与，如糖酵解中的两次和在三羧酸循环中的一次。`,topic:`生物氧化`,note:`与氧化磷酸化对比记：底物水平磷酸化不依赖电子传递链，无氧条件下也能进行。`},{id:`biochem-0054`,subject:`biochem`,en:`De novo nucleotide synthesis`,cn:`核苷酸的从头合成`,defCn:`利用磷酸核糖、氨基酸、一碳单位和二氧化碳等简单物质为原料，经一系列酶促反应逐步合成核苷酸的途径，需消耗大量能量，主要在肝脏进行，与补救合成途径相对。`,topic:`核苷酸代谢`,note:`2023年判断题考过"嘌呤核苷酸从头合成的小分子包括二氧化碳、Asp、Glu、Gly和甲酰四氢叶酸"。`}],u=[{id:`cell-0001`,subject:`cell`,en:`Cell theory`,cn:`细胞学说`,defCn:`由施莱登和施旺提出、后经魏尔肖等人补充的学说，认为细胞是生物体结构和功能的基本单位，一切生物都由细胞发育而来，细胞只能来自已存在的细胞。`,topic:`绪论`,note:``},{id:`cell-0002`,subject:`cell`,en:`Fluid mosaic model`,cn:`流动镶嵌模型`,defCn:`由辛格和尼科尔森提出的质膜结构模型，认为磷脂双分子层构成膜的骨架并具有流动性，蛋白质分子以镶嵌、贯穿或附着的方式不均匀地分布在脂质双分子层中，膜的组分可以侧向扩散。`,topic:`细胞膜与膜运输`,note:`与"三夹板模型""单位膜模型"区分：只有流动镶嵌模型强调膜的流动性和蛋白质分布的不对称性。`},{id:`cell-0003`,subject:`cell`,en:`Lipid raft`,cn:`脂筏`,defCn:`质膜上富含胆固醇和鞘磷脂的、排列较为紧密的微区，直径约70～100nm，许多信号分子和膜蛋白在此聚集，是信号转导和膜泡运输的重要平台。`,topic:`细胞膜与膜运输`,note:``},{id:`cell-0004`,subject:`cell`,en:`Channel protein`,cn:`通道蛋白`,defCn:`跨膜蛋白中一类在膜上形成亲水性通道、介导水和某些离子及小分子顺电化学梯度快速跨膜运输的转运蛋白，其转运不与被转运物结合，也不消耗能量。`,topic:`细胞膜与膜运输`,note:`与载体蛋白区分：载体蛋白与被转运物结合并发生构象变化，通道蛋白不结合底物、转运速率更高。`},{id:`cell-0005`,subject:`cell`,en:`Ion channel-coupled receptor`,cn:`离子通道偶联受体`,defCn:`又称配体门控离子通道，本身既是受体又是离子通道，配体与受体结合后直接引起通道构象改变而开放，使特定离子顺电化学梯度跨膜流动，从而产生快速的电信号。`,topic:`细胞信号转导`,note:`与G蛋白偶联受体区分：离子通道偶联受体的效应器就是通道本身，响应速度快。`},{id:`cell-0006`,subject:`cell`,en:`Ligand gated ion channel`,cn:`配体门控离子通道`,defCn:`由配体与受体结合引起通道蛋白构象变化而开放、使特定离子顺电化学梯度跨膜流动的离子通道，是细胞快速响应外界信号的膜受体类型之一。`,topic:`细胞信号转导`,note:`与离子通道偶联受体为同一类结构的两种称法。`},{id:`cell-0007`,subject:`cell`,en:`Exocytosis`,cn:`胞吐`,defCn:`细胞内囊泡与质膜融合，将内含物排出细胞外的物质运输过程，是分泌蛋白、神经递质等释放的主要途径，可分为组成型和调节型两种。`,topic:`细胞膜与膜运输`,note:`与胞吞作用方向相反，两者合称膜泡运输。`},{id:`cell-0008`,subject:`cell`,en:`Endoplasmic reticulum stress`,cn:`内质网应激`,defCn:`缺氧、钙稳态失衡、错误折叠或未折叠蛋白在内质网腔中大量堆积等因素导致内质网功能紊乱时，细胞启动的适应性应激反应，可通过未折叠蛋白反应减少蛋白合成、增加分子伴侣并促进降解，应激过强时则诱导细胞凋亡。`,topic:`内膜系统与蛋白质分选`,note:`与未折叠蛋白反应区分：内质网应激是整体反应，未折叠蛋白反应是其核心机制。`},{id:`cell-0009`,subject:`cell`,en:`Unfolded protein response`,cn:`未折叠蛋白反应`,defCn:`内质网中未折叠或错误折叠蛋白堆积时，细胞通过抑制蛋白质翻译、上调分子伴侣表达和增强内质网相关降解来恢复内质网稳态的信号通路，持续激活则诱导细胞凋亡。`,topic:`内膜系统与蛋白质分选`,note:``},{id:`cell-0010`,subject:`cell`,en:`Trans Golgi network`,cn:`反面高尔基体网络`,defCn:`位于高尔基体反面的管状囊泡网络结构，是蛋白质和脂质进行分选、包装并运往质膜、分泌泡或溶酶体的主要场所，被认为是高尔基体的"出口分拣站"。`,topic:`内膜系统与蛋白质分选`,note:`与顺面高尔基体网络区分：后者位于顺面，负责接受内质网来的运输小泡。`},{id:`cell-0011`,subject:`cell`,en:`Nuclear pore complex`,cn:`核孔复合体`,defCn:`镶嵌在核膜孔上的大型蛋白复合体，由胞质环、核质环、辐和中央栓等结构组成，介导核质之间蛋白质与RNA等大分子的双向选择性运输。`,topic:`细胞核与染色体`,note:``},{id:`cell-0012`,subject:`cell`,en:`Nuclear localization signal`,cn:`核定位信号`,defCn:`蛋白质中一段富含赖氨酸和精氨酸等碱性氨基酸的短肽序列，可被核输入受体识别，引导该蛋白质经核孔复合体主动运输进入细胞核。`,topic:`细胞核与染色体`,note:`缩写 NLS。答"名词翻译与解释"时建议写出全称并给出缩写。`},{id:`cell-0013`,subject:`cell`,en:`Nucleolus`,cn:`核仁`,defCn:`细胞核内无界膜包被的球状结构，由纤维中心和致密纤维组分、颗粒组分等构成，是rRNA合成、加工以及核糖体亚基组装的场所。`,topic:`细胞核与染色体`,note:``},{id:`cell-0014`,subject:`cell`,en:`Nucleosome`,cn:`核小体`,defCn:`染色质的基本结构单位，由H2A、H2B、H3、H4各两分子组成的组蛋白八聚体核心，以及缠绕其外约1.75圈、长度约146bp的DNA构成，相邻核小体之间由连接DNA相连。`,topic:`细胞核与染色体`,note:`885分子生物学同样考过。与"染色质""染色体"区分：核小体是染色质的一级结构单位。`},{id:`cell-0015`,subject:`cell`,en:`Heterochromatin`,cn:`异染色质`,defCn:`细胞分裂间期仍保持高度凝集、染色较深、转录活性很低或不活泼的染色质，多分布于核周缘，分为组成型异染色质和兼性异染色质两类。`,topic:`细胞核与染色体`,note:`2023年与2024年连续考过。与常染色质区分：常染色质松散、染色浅、转录活跃。`},{id:`cell-0016`,subject:`cell`,en:`Dynein arm`,cn:`动力蛋白臂`,defCn:`纤毛和鞭毛轴丝中附着于A亚微管上的动力蛋白复合体，具有ATP酶活性，通过水解ATP驱动相邻二联体微管相对滑动，是纤毛和鞭毛摆动的动力来源。`,topic:`细胞骨架`,note:`与肌球蛋白、驱动蛋白区分：动力蛋白沿微管向负极移动，驱动蛋白向正极移动。`},{id:`cell-0017`,subject:`cell`,en:`Cyclin`,cn:`细胞周期蛋白`,defCn:`一类能与细胞周期蛋白依赖性激酶（CDK）结合并调节其活性的蛋白质，其含量随细胞周期时相呈现周期性合成与降解，是细胞周期调控的核心分子。`,topic:`细胞增殖与细胞周期`,note:`与CDK区分：CDK含量恒定，Cyclin含量周期性变化，二者结合形成成熟促进因子MPF。`},{id:`cell-0018`,subject:`cell`,en:`Kinetochore`,cn:`动粒`,defCn:`位于染色体着丝粒两侧、由多种蛋白质组成的盘状结构，是纺锤体微管与染色体相连的部位，参与染色体的向极运动和后期染色体分离的调控。`,topic:`细胞增殖与细胞周期`,note:`与着丝粒区分：着丝粒是主缢痕处DNA序列和结构，动粒是其两侧的蛋白结构。`},{id:`cell-0019`,subject:`cell`,en:`Meiosis`,cn:`减数分裂`,defCn:`有性生殖细胞形成过程中发生的一种特殊的有丝分裂，DNA只复制一次而细胞连续分裂两次，同源染色体在减数第一次分裂时分离，姐妹染色单体在第二次分裂时分离，最终子细胞染色体数目减半。`,topic:`细胞增殖与细胞周期`,note:`与有丝分裂对比记：有丝分裂DNA复制一次、分裂一次，子细胞染色体数与母细胞相同。`},{id:`cell-0020`,subject:`cell`,en:`Telomerase`,cn:`端粒酶`,defCn:`一种由蛋白质和RNA组成的反转录酶，以自身携带的RNA为模板合成端粒重复序列并加在染色体末端，从而延长端粒DNA、补偿复制性末端缩短，使细胞避免复制性衰老。`,topic:`细胞增殖与细胞周期`,note:`注意"反转录酶"这一属性是得分点。`},{id:`cell-0021`,subject:`cell`,en:`Cell cycle synchronization`,cn:`细胞周期同步化`,defCn:`采用药物抑制、营养缺乏或温度处理等方法，使培养的细胞群体停留在细胞周期的同一时相，从而获得大量处于相同周期阶段的细胞的技术，常用方法有血清饥饿法、双阻断法、有丝分裂摇落法和低温休克法。`,topic:`细胞增殖与细胞周期`,note:``},{id:`cell-0022`,subject:`cell`,en:`Contact inhibition`,cn:`接触抑制`,defCn:`体外培养的正常细胞分裂增殖到相互接触时，细胞运动和分裂便停止的现象，是正常细胞重要的生长调控特性，癌细胞则失去接触抑制而表现为无限增殖和堆积生长。`,topic:`癌细胞`,note:`是判断正常细胞与癌变细胞的经典指标之一。`},{id:`cell-0023`,subject:`cell`,en:`Oncogene`,cn:`癌基因`,defCn:`原癌基因在病毒转导、突变、扩增或染色体易位等因素作用下被异常激活后形成的基因，其表达产物能持续促进细胞增殖、抑制凋亡，从而导致细胞恶性转化和肿瘤发生。`,topic:`癌细胞`,note:`与原癌基因区分：原癌基因是正常细胞中存在的、参与正常生长调控的基因；癌基因是其异常激活形式。`},{id:`cell-0024`,subject:`cell`,en:`Proto-oncogene`,cn:`原癌基因`,defCn:`正常细胞基因组中存在的、编码生长因子及其受体、信号转导蛋白、核内转录因子等促进细胞增殖相关蛋白的基因，其产物参与正常的生长分化调控，当发生突变或异常表达时可转变为癌基因。`,topic:`癌细胞`,note:``},{id:`cell-0025`,subject:`cell`,en:`Tumor suppressor gene`,cn:`抑癌基因`,defCn:`正常细胞中存在的、其表达产物能抑制细胞增殖、促进细胞凋亡或参与DNA损伤修复的基因，如p53、Rb，其功能丧失或失活时细胞失去负向调控而易于发生恶性转化。`,topic:`癌细胞`,note:`与癌基因区分：癌基因是激活后促进癌变，抑癌基因是失活后导致癌变。`},{id:`cell-0026`,subject:`cell`,en:`Cell differentiation`,cn:`细胞分化`,defCn:`同一来源的细胞在形态结构、生理功能和生化特征上逐渐产生稳定差异、形成不同细胞类型的过程，其本质是基因的选择性表达，具有稳定性、可逆性和普遍性。`,topic:`细胞分化`,note:``},{id:`cell-0027`,subject:`cell`,en:`Housekeeping gene`,cn:`管家基因`,defCn:`在所有细胞的各个发育阶段都持续表达、其表达产物为维持细胞基本生命活动所必需的基因，如编码核糖体蛋白、糖酵解酶的基因，其表达受环境因素影响较小。`,topic:`细胞分化`,note:`2022年与2026年都考过。与组织特异性基因（奢侈基因）相对。`},{id:`cell-0028`,subject:`cell`,en:`Tissue-specific gene`,cn:`组织特异性基因`,defCn:`又称奢侈基因，只在某种特定类型的细胞中表达，其表达产物赋予该种细胞特定的形态结构和生理功能的基因，如红细胞的血红蛋白基因。`,topic:`细胞分化`,note:`与管家基因相对，是细胞分化研究的重要对象。`},{id:`cell-0029`,subject:`cell`,en:`Apoptosis`,cn:`细胞凋亡`,defCn:`由基因控制的细胞自主的、有序的程序性死亡过程，表现为细胞皱缩、染色质固缩边集、DNA被降解成片段、形成凋亡小体，最终被邻近细胞吞噬，不引起炎症反应。`,topic:`细胞衰老与死亡`,note:`与细胞坏死对比记：凋亡是主动、程序性、不引起炎症；坏死是被动、膜破裂、引起炎症。`},{id:`cell-0030`,subject:`cell`,en:`Programmed cell death`,cn:`程序性细胞死亡`,defCn:`由基因控制的细胞自主的、有序的死亡方式，是机体在发育过程中清除多余细胞、维持内环境稳定和防御的重要机制，细胞凋亡是其最主要的类型。`,topic:`细胞衰老与死亡`,note:`与细胞凋亡的关系：细胞凋亡是程序性细胞死亡的主要形式，但程序性细胞死亡不限于凋亡。`},{id:`cell-0031`,subject:`cell`,en:`Apoptotic body`,cn:`凋亡小体`,defCn:`细胞凋亡后期，细胞质膜内陷并将细胞内容物（包括核碎片和细胞器）包裹形成的膜包围小体，可被邻近细胞或巨噬细胞识别并吞噬清除，因而不引起炎症反应。`,topic:`细胞衰老与死亡`,note:``},{id:`cell-0032`,subject:`cell`,en:`Stem cell niche`,cn:`干细胞巢`,defCn:`体内维持干细胞自我更新能力并调控其分化方向的特定微环境，由周围的支持细胞、细胞外基质以及多种信号分子共同构成，为干细胞提供生存和增殖的场所与信号。`,topic:`干细胞`,note:`与"微环境"同义，答全"niche"的含义是得分点。`},{id:`cell-0033`,subject:`cell`,en:`Induced pluripotent stem cell`,cn:`诱导多能干细胞`,defCn:`通过向体细胞中导入Oct4、Sox2、Klf4、c-Myc四种转录因子，使其重编程而获得的具有类似胚胎干细胞多向分化潜能的干细胞，简称iPS细胞。`,topic:`干细胞`,note:`2026年考"Induced pluripotent stem cells"。答出四种转录因子是得分点。`},{id:`cell-0034`,subject:`cell`,en:`Chemically induced pluripotent stem cell`,cn:`化学诱导多能干细胞`,defCn:`完全用小分子化合物组合处理体细胞，通过调控多条信号通路使其重编程为多能性状态的干细胞，避免了外源基因导入带来的安全性问题。`,topic:`干细胞`,note:`与iPS细胞区分：iPS靠导入转录因子，CiPS靠小分子化合物。`},{id:`cell-0035`,subject:`cell`,en:`Signal transduction`,cn:`信号转导`,defCn:`细胞通过膜上或胞内受体识别外界信号分子，经胞内一系列信号传递蛋白的转换、传递和逐级放大，最终引起基因表达改变或酶活性变化等特定生物学效应的过程。`,topic:`细胞信号转导`,note:``},{id:`cell-0036`,subject:`cell`,en:`G protein-coupled receptor`,cn:`G蛋白偶联受体`,defCn:`由一条多肽链七次跨膜形成的受体家族，其胞内区与G蛋白偶联，配体结合后激活G蛋白，进而调节腺苷酸环化酶、磷脂酶C等效应器的活性或离子通道的开闭。`,topic:`细胞信号转导`,note:`缩写 GPCR。与离子通道偶联受体、酶偶联受体并列为三类主要膜受体。`},{id:`cell-0037`,subject:`cell`,en:`Second messenger`,cn:`第二信使`,defCn:`细胞接受第一信使（胞外信号分子）后，在细胞内产生的、负责将信号传递和放大的小分子物质，如cAMP、cGMP、IP3、DAG和Ca2+等。`,topic:`细胞信号转导`,note:`与第一信使区分：第一信使是胞外信号分子（如激素、神经递质）。`},{id:`cell-0038`,subject:`cell`,en:`Autocrine`,cn:`自分泌`,defCn:`细胞分泌的信号分子作用于自身细胞表面的受体，从而对自身生长、增殖或分化进行调节的一种信号传递方式，肿瘤细胞常通过自分泌维持自主性增殖。`,topic:`细胞信号转导`,note:`与旁分泌、内分泌并列，区别在于靶细胞是自身。`},{id:`cell-0039`,subject:`cell`,en:`Molecular switches`,cn:`分子开关`,defCn:`细胞内能够在"开"与"关"两种活性状态之间可逆转换、从而调控信号通路和细胞活动的蛋白质，主要有两类机制：蛋白质的磷酸化与去磷酸化，以及GTP结合蛋白的GTP结合与水解。`,topic:`细胞信号转导`,note:``},{id:`cell-0040`,subject:`cell`,en:`Gap junction`,cn:`间隙连接`,defCn:`由六个连接蛋白围成中空通道、相邻细胞质膜上通道对接形成的细胞间连接，允许离子和小分子代谢物直接在细胞间通过，实现细胞间的电信号和化学信号通讯。`,topic:`细胞连接`,note:`与紧密连接区分：间隙连接是通讯连接，紧密连接是封闭连接。`},{id:`cell-0041`,subject:`cell`,en:`Tight junction`,cn:`紧密连接`,defCn:`相邻细胞质膜局部紧密靠拢形成的封闭连接，由跨膜蛋白（如闭合蛋白、封闭蛋白）在细胞间隙中直接相连，具有封闭细胞间隙、阻止物质自由穿行和维持细胞极性、构成屏障的作用。`,topic:`细胞连接`,note:``},{id:`cell-0042`,subject:`cell`,en:`Communicating junction`,cn:`通讯连接`,defCn:`相邻细胞间能够直接进行物质交换和信号传递的细胞连接方式，动物细胞中主要为间隙连接，植物细胞中为胞间连丝。`,topic:`细胞连接`,note:`与锚定连接、封闭连接并列为三类细胞连接。`},{id:`cell-0043`,subject:`cell`,en:`Fluorescence in situ hybridization`,cn:`荧光原位杂交`,defCn:`用荧光素标记的核酸探针与染色体或细胞中的特定核酸序列按碱基互补原则杂交，再通过荧光显微镜观察荧光信号位置，从而对目标序列进行定位和定量分析的技术。`,topic:`研究方法与技术`,note:`缩写 FISH。2022年卷面写的是 "Fluorescence in situ hybridization technology"。`},{id:`cell-0044`,subject:`cell`,en:`Cryo-electron microscopy`,cn:`冷冻电镜技术`,defCn:`将生物样品快速冷冻使其在玻璃态冰中保持天然构象，再用透射电子显微镜成像并借助图像处理重构三维密度图，从而解析生物大分子高分辨率结构的技术。`,topic:`研究方法与技术`,note:`与X射线晶体衍射、核磁共振并列为结构生物学的三大手段。`},{id:`cell-0045`,subject:`cell`,en:`Microtubule`,cn:`微管`,defCn:`由α、β微管蛋白异二聚体首尾相接形成原纤维、再纵向排列组装成的中空管状结构，外径约25nm，具有动态不稳定性，参与维持细胞形态、胞内物质运输、纺锤体形成和纤毛鞭毛运动。`,topic:`细胞骨架`,note:`与微丝（肌动蛋白构成）和中间纤维（无极性、最稳定）并列为三大细胞骨架。`},{id:`cell-0046`,subject:`cell`,en:`Microfilament`,cn:`微丝`,defCn:`由肌动蛋白单体聚合形成的直径约7nm的细长纤维，具有极性，可发生组装与解聚的动态变化，参与细胞形态维持、细胞运动、胞质分裂和肌肉收缩。`,topic:`细胞骨架`,note:``},{id:`cell-0047`,subject:`cell`,en:`Intermediate filament`,cn:`中间纤维`,defCn:`由杆状蛋白单体以α螺旋形式缠绕成二聚体、再组装形成的直径约10nm的纤维，无极性、不结合核苷酸、结构最为稳定，主要起机械支撑和抗张力作用。`,topic:`细胞骨架`,note:`与微管、微丝区分：中间纤维无极性、不解聚，是三者中最稳定的。`},{id:`cell-0048`,subject:`cell`,en:`Motor protein`,cn:`马达蛋白`,defCn:`一类能水解ATP并将释放的化学能转变为机械能、沿细胞骨架定向行走并运输货物或产生力的蛋白质，包括沿微管向正极移动的驱动蛋白、向负极移动的胞质动力蛋白，以及沿微丝移动的肌球蛋白。`,topic:`细胞骨架`,note:`常与细胞骨架一起出现在简答题中，注意三种马达蛋白与各自轨道的对应关系。`},{id:`cell-0049`,subject:`cell`,en:`Clathrin`,cn:`网格蛋白`,defCn:`由三条重链和三条轻链组成的三腿蛋白复合体，在受体介导的胞吞过程中于质膜胞质侧装配成网格状衣被，牵引质膜内陷并形成有被小泡。`,topic:`细胞膜与膜运输`,note:`2023年真题以LDL摄取为例考过受体介导的网格蛋白有被小泡内吞过程。`},{id:`cell-0050`,subject:`cell`,en:`Receptor-mediated endocytosis`,cn:`受体介导的胞吞`,defCn:`细胞通过质膜上的特异性受体识别并结合胞外配体，经网格蛋白有被小泡包裹内陷形成囊泡，从而高效、选择性地摄取特定大分子的过程，如细胞对低密度脂蛋白的摄取。`,topic:`细胞膜与膜运输`,note:``},{id:`cell-0051`,subject:`cell`,en:`Proteasome`,cn:`蛋白酶体`,defCn:`真核细胞中呈桶状的巨大蛋白复合体，能识别被多聚泛素链标记的蛋白质，在消耗ATP的条件下将其降解为短肽，是细胞内蛋白质选择性降解的主要场所。`,topic:`内膜系统与蛋白质分选`,note:`2022年真题简答题考过其作用机制，与溶酶体降解途径区分。`},{id:`cell-0052`,subject:`cell`,en:`Ubiquitin`,cn:`泛素`,defCn:`由76个氨基酸组成、序列高度保守的小分子蛋白质，通过E1、E2、E3三级酶的级联反应与底物蛋白的赖氨酸残基共价结合，形成多聚泛素链标记该蛋白，使其被蛋白酶体识别降解。`,topic:`内膜系统与蛋白质分选`,note:``},{id:`cell-0053`,subject:`cell`,en:`Caspase`,cn:`半胱天冬酶`,defCn:`细胞凋亡过程中起关键作用的一类半胱氨酸蛋白酶，以无活性的酶原形式存在，被上游信号激活后通过级联放大切割底物，是执行细胞凋亡的核心分子。`,topic:`细胞衰老与死亡`,note:`2024年论述题考过"caspase蛋白与细胞凋亡"，注意起始caspase与效应caspase的区分。`},{id:`cell-0054`,subject:`cell`,en:`Cyclin-dependent kinase`,cn:`细胞周期蛋白依赖性激酶`,defCn:`一类只有在与细胞周期蛋白结合后才具有活性的蛋白激酶，其含量在细胞周期中相对恒定，通过磷酸化下游底物驱动细胞周期各时相的转换。`,topic:`细胞增殖与细胞周期`,note:`缩写 CDK。与Cyclin的关系是常考点：CDK含量恒定、Cyclin周期性变化，二者结合形成MPF。`},{id:`cell-0055`,subject:`cell`,en:`Sodium-potassium pump`,cn:`钠钾泵`,defCn:`存在于质膜上的P型ATP酶，每水解一分子ATP可将3个Na+泵出细胞、同时将2个K+泵入细胞，从而维持细胞内高钾低钠的离子梯度、膜电位和细胞渗透压。`,topic:`细胞膜与膜运输`,note:`2026年真题简答题考过其结构特点、作用机制及生理意义。属主动运输的典型实例。`},{id:`cell-0056`,subject:`cell`,en:`Cotranslational translocation`,cn:`共翻译转运`,defCn:`分泌蛋白在游离核糖体上起始合成后，由N端信号肽引导核糖体附着到粗面内质网膜上，新生肽链边合成边通过转运通道进入内质网腔的蛋白质转运方式。`,topic:`内膜系统与蛋白质分选`,note:`与翻译后转运区分：后者在肽链完全合成后才转运，主要见于线粒体和叶绿体蛋白。`},{id:`cell-0057`,subject:`cell`,en:`Signal peptide`,cn:`信号肽`,defCn:`位于分泌蛋白N端的一段由15～30个氨基酸组成的疏水性短肽，可被信号识别颗粒识别并引导核糖体附着到内质网膜上，决定蛋白质的分选去向，转运完成后通常被切除。`,topic:`内膜系统与蛋白质分选`,note:`与核定位信号（NLS）区分：信号肽在N端且转运后被切除，NLS可位于肽链内部且不被切除。`},{id:`cell-0058`,subject:`cell`,en:`Molecular chaperone`,cn:`分子伴侣`,defCn:`一类能识别并结合部分折叠或错误折叠的蛋白质、协助其正确折叠、组装、跨膜转运或降解，但自身不成为终产物组成部分的蛋白质，如热激蛋白Hsp70。`,topic:`内膜系统与蛋白质分选`,note:``},{id:`cell-0059`,subject:`cell`,en:`Endoplasmic reticulum`,cn:`内质网`,defCn:`由单层膜围成的管状、泡状和扁平囊状结构相互连通形成的细胞器，分为膜上附着核糖体的粗面内质网和表面光滑的光面内质网，是蛋白质合成与加工、脂质合成和钙离子储存的场所。`,topic:`内膜系统与蛋白质分选`,note:`2024年简答题考过"内质网的两种基本类型和功能"。`},{id:`cell-0060`,subject:`cell`,en:`Lysosome`,cn:`溶酶体`,defCn:`由单层膜包被、内含多种酸性水解酶的细胞器，内部呈酸性，是细胞内消化和降解衰老细胞器、吞噬物及外来物质的主要场所。`,topic:`内膜系统与蛋白质分选`,note:`与蛋白酶体区分：溶酶体负责膜包裹的非选择性降解，蛋白酶体负责泛素标记的选择性降解。`},{id:`cell-0061`,subject:`cell`,en:`Vesicular transport`,cn:`膜泡运输`,defCn:`通过囊泡的出芽形成、定向转运和与靶膜融合，实现蛋白质和脂质在细胞器之间以及细胞与外界之间运输的方式，可分为组成型和调节型两类。`,topic:`内膜系统与蛋白质分选`,note:`2024年简答题考过"膜泡运输的类型与运输区间"。`},{id:`cell-0062`,subject:`cell`,en:`Chloroplast`,cn:`叶绿体`,defCn:`植物细胞特有的、由双层膜包被的细胞器，内部含类囊体垛叠形成的基粒和基质，含有叶绿素等光合色素，是进行光合作用、把光能转变为化学能的场所。`,topic:`内膜系统与蛋白质分选`,note:`2024年简答题考过其功能与起源假说（内共生起源学说）。`},{id:`cell-0063`,subject:`cell`,en:`Reactive oxygen species`,cn:`活性氧`,defCn:`细胞有氧代谢过程中产生的化学性质活泼的含氧分子或离子，包括超氧阴离子、过氧化氢和羟自由基等，适量时可作为信号分子，过量时则造成氧化胁迫，损伤蛋白质、脂质和DNA。`,topic:`细胞衰老与死亡`,note:`缩写 ROS。2025年论述题考过氧化胁迫下线粒体的应激反应。`},{id:`cell-0064`,subject:`cell`,en:`Nitric oxide`,cn:`一氧化氮`,defCn:`由一氧化氮合酶催化精氨酸氧化生成的小分子气体信号分子，能透过质膜迅速扩散，通过激活鸟苷酸环化酶使cGMP升高，引起血管平滑肌舒张、神经传递和免疫防御等多种生物学效应。`,topic:`细胞信号转导`,note:`缩写 NO。2026年简答题考过其合成过程及生物学效应。`},{id:`cell-0065`,subject:`cell`,en:`Cell senescence`,cn:`细胞衰老`,defCn:`细胞在体外培养一定代数后增殖能力逐渐下降直至完全停止，同时形态和生理功能发生退行性变化的现象，表现为端粒缩短、衰老相关β-半乳糖苷酶活性升高和衰老相关分泌表型等特征。`,topic:`细胞衰老与死亡`,note:`2025年论述题考过复制衰老的形态与分子特征，是高频考点。`},{id:`cell-0066`,subject:`cell`,en:`Spindle`,cn:`纺锤体`,defCn:`细胞分裂期由微管和多种马达蛋白组装形成的、牵引染色体向两极移动的临时性装置，由纺锤体两极、动粒微管、极微管和星体微管等构成。`,topic:`细胞增殖与细胞周期`,note:`与"纺锤体组装检查点"联系记忆，是保证染色体正确分离的监控机制。`},{id:`cell-0067`,subject:`cell`,en:`Nuclear envelope`,cn:`核被膜`,defCn:`由内、外两层单位膜构成的包被细胞核的膜结构，外膜与内质网相连，核周间隙与内质网腔相通，膜上分布核孔复合体，控制核质之间的物质交换。`,topic:`细胞核与染色体`,note:``},{id:`cell-0068`,subject:`cell`,en:`Extracellular matrix`,cn:`细胞外基质`,defCn:`由细胞分泌到细胞外空间的大分子物质构成的网络，主要包括胶原、蛋白聚糖、粘连蛋白和纤连蛋白等，对细胞起支持、连接、保护和信号调控作用。`,topic:`细胞连接`,note:`缩写 ECM。与细胞连接配合记忆，注意整合素在其中的桥梁作用。`},{id:`cell-0069`,subject:`cell`,en:`Cell adhesion molecule`,cn:`细胞黏附分子`,defCn:`位于细胞表面、介导细胞与细胞之间或细胞与细胞外基质之间相互识别和结合的跨膜糖蛋白，主要包括钙黏素、选择素、免疫球蛋白超家族和整合素四类。`,topic:`细胞连接`,note:`缩写 CAM。`},{id:`cell-0070`,subject:`cell`,en:`Stem cell`,cn:`干细胞`,defCn:`一类同时具有自我更新能力和多向分化潜能、能产生至少一种类型高度分化子细胞的细胞，按分化潜能可分为全能干细胞、多能干细胞和单能干细胞。`,topic:`干细胞`,note:`2024年论述题考过"癌细胞与干细胞的比较"。`},{id:`cell-0071`,subject:`cell`,en:`Autophagy`,cn:`自噬`,defCn:`细胞在营养缺乏或受到胁迫时，通过形成双层膜的自噬体包裹受损细胞器、错误折叠蛋白等胞内成分，送入溶酶体降解并回收利用的过程，是细胞维持稳态的重要机制。`,topic:`细胞衰老与死亡`,note:`与细胞凋亡区分：自噬以自噬体形成为特征，凋亡以凋亡小体形成为特征。`},{id:`cell-0072`,subject:`cell`,en:`Epithelial-mesenchymal transition`,cn:`上皮-间质转化`,defCn:`上皮细胞在特定信号作用下逐渐失去上皮极性和细胞间黏附、获得间质细胞形态和迁移侵袭能力的过程，在胚胎发育、组织修复和肿瘤转移中具有重要作用。`,topic:`细胞分化`,note:`缩写 EMT。与肿瘤转移的联系是常考的延伸点。`},{id:`cell-0073`,subject:`cell`,en:`Protein sorting`,cn:`蛋白质分选`,defCn:`新合成的蛋白质在自身信号肽或分选信号的引导下，被特异性地转运到相应细胞器、质膜或分泌到细胞外的过程，可分为共翻译转运和翻译后转运两种途径。`,topic:`内膜系统与蛋白质分选`,note:`2025年简答题考过"核基因编码的蛋白质分选途径"。`},{id:`cell-0074`,subject:`cell`,en:`Cell necrosis`,cn:`细胞坏死`,defCn:`由缺氧、理化损伤、微生物侵袭等致病因素引起的细胞被动死亡，表现为细胞肿胀、细胞器变形、质膜通透性增高直至破裂，内容物外溢并引起周围组织炎症反应。`,topic:`细胞衰老与死亡`,note:`与细胞凋亡对比记：坏死被动、膜破裂、引起炎症；凋亡主动、形成凋亡小体、不引起炎症。`}],d=[{id:`mol-0001`,subject:`molecular`,en:`Central Dogma`,cn:`中心法则`,defCn:`由克里克提出的、描述遗传信息传递方向的基本法则，即遗传信息从DNA流向RNA再流向蛋白质；后来补充了RNA向DNA的反转录以及RNA向RNA的复制，使其更加完整。`,topic:`绪论`,note:``},{id:`mol-0002`,subject:`molecular`,en:`Genome`,cn:`基因组`,defCn:`一个生物体所携带的全部遗传信息的总和，即其全部DNA序列（RNA病毒则为全部RNA序列），包括编码序列和非编码序列。`,topic:`染色体与DNA`,note:``},{id:`mol-0003`,subject:`molecular`,en:`Chromosome`,cn:`染色体`,defCn:`真核细胞分裂期由DNA和蛋白质高度折叠形成的、可被碱性染料着色的棒状结构，是遗传物质的主要载体，由着丝粒、端粒、复制起点等结构要素构成。`,topic:`染色体与DNA`,note:`与染色质区分：染色体是分裂期高度折叠的形态，染色质是间期的存在形式，二者是同种物质的不同状态。`},{id:`mol-0004`,subject:`molecular`,en:`Chromatin`,cn:`染色质`,defCn:`细胞分裂间期细胞核内由DNA、组蛋白、非组蛋白及少量RNA组成的复合物，呈细丝状，分为常染色质和异染色质两类。`,topic:`染色体与DNA`,note:``},{id:`mol-0005`,subject:`molecular`,en:`Nucleosome`,cn:`核小体`,defCn:`染色质的基本结构单位，由H2A、H2B、H3、H4各两分子构成的组蛋白八聚体核心，以及缠绕其外约1.75圈、长约146bp的DNA组成，彼此由连接DNA相连。`,topic:`染色体与DNA`,note:`661细胞生物学也考过。若两科同时考，注意分值不同（细胞3分、分子4分），释义详略可相应调整。`},{id:`mol-0006`,subject:`molecular`,en:`DNA Replication`,cn:`DNA复制`,defCn:`以亲代DNA分子为模板合成子代DNA的过程，具有半保留复制、双向复制和半不连续复制三大特点，需要模板、底物、引物、多种酶和蛋白因子的参与。`,topic:`染色体与DNA`,note:``},{id:`mol-0007`,subject:`molecular`,en:`Semiconservative replication`,cn:`半保留复制`,defCn:`DNA复制时双螺旋解开，每条母链各自作为模板合成互补的新链，形成的两个子代DNA分子中各保留一条亲代链和一条新合成的链。`,topic:`染色体与DNA`,note:`由Meselson-Stahl密度梯度离心实验证明。`},{id:`mol-0008`,subject:`molecular`,en:`Origin of Replication`,cn:`复制起点`,defCn:`DNA分子上复制起始的特定核苷酸序列，原核生物染色体只有一个复制起点（oriC），真核生物染色体上有多个复制起点，可同时启动复制以提高复制效率。`,topic:`染色体与DNA`,note:``},{id:`mol-0009`,subject:`molecular`,en:`Lagging strand`,cn:`后随链`,defCn:`DNA半不连续复制中，以5'→3'方向、与复制叉前进方向相反合成的子链，只能先合成若干不连续的冈崎片段，再由DNA连接酶连接成完整的新链。`,topic:`染色体与DNA`,note:`与前导链区分：前导链连续合成，后随链不连续合成。`},{id:`mol-0010`,subject:`molecular`,en:`Okazaki fragments`,cn:`冈崎片段`,defCn:`DNA不连续复制过程中在后随链上合成的不连续短DNA片段，原核生物长约1000～2000个核苷酸，真核生物长约100～200个核苷酸，随后由DNA连接酶连接成完整链。`,topic:`染色体与DNA`,note:``},{id:`mol-0011`,subject:`molecular`,en:`Topoisomerase`,cn:`拓扑异构酶`,defCn:`通过切断DNA的一条链或两条链并重新连接，改变DNA分子的拓扑构象、消除复制和转录过程中产生的正超螺旋张力的酶，分Ⅰ型和Ⅱ型两类。`,topic:`染色体与DNA`,note:`与解旋酶区分：解旋酶破坏碱基对间的氢键使双链解开，拓扑异构酶切断并重接磷酸二酯键释放张力。`},{id:`mol-0012`,subject:`molecular`,en:`DNA ligase`,cn:`DNA连接酶`,defCn:`催化一个DNA链的3'-羟基末端与另一个DNA链的5'-磷酸基团之间形成磷酸二酯键，从而把两个DNA片段共价连接起来的酶，是复制和基因工程中的关键工具酶。`,topic:`染色体与DNA`,note:`在细胞内负责封闭复制产生的缺口和连接冈崎片段。`},{id:`mol-0013`,subject:`molecular`,en:`cccDNA`,cn:`共价闭合环状DNA`,defCn:`两条链均无缺口、以共价键形成闭环的双链环状DNA分子，如质粒和乙肝病毒基因组，其超螺旋结构使其在电泳中迁移速率与同分子量线性DNA不同。`,topic:`染色体与DNA`,note:`全称 covalently closed circular DNA，答题时应写出全称并说明与开环、线性DNA的区别。`},{id:`mol-0014`,subject:`molecular`,en:`DNA methylation`,cn:`DNA甲基化`,defCn:`在DNA甲基转移酶催化下，S-腺苷甲硫氨酸提供甲基，使胞嘧啶第5位碳原子发生共价修饰生成5-甲基胞嘧啶的过程，主要发生在CpG岛，通常与基因转录抑制和基因组稳定性维持有关。`,topic:`基因表达调控`,note:``},{id:`mol-0015`,subject:`molecular`,en:`Histone Modification`,cn:`组蛋白修饰`,defCn:`组蛋白N端尾部氨基酸残基发生的乙酰化、甲基化、磷酸化、泛素化等共价修饰，通过改变染色质的疏松程度和募集调控蛋白，在转录调控、DNA修复等过程中发挥重要作用。`,topic:`基因表达调控`,note:`与DNA甲基化共同构成表观遗传修饰的两大主要内容。`},{id:`mol-0016`,subject:`molecular`,en:`Base flipping`,cn:`碱基翻转`,defCn:`DNA修饰酶或修复酶识别特定碱基后，使该碱基从双螺旋内部翻转出来进入酶的活性中心的构象变化，使酶能够直接接触并修饰或切除该碱基。`,topic:`基因表达调控`,note:`DNA甲基转移酶和DNA糖苷酶都采用这一机制。`},{id:`mol-0017`,subject:`molecular`,en:`Promoter`,cn:`启动子`,defCn:`位于基因转录起始位点上游、能被RNA聚合酶及转录因子识别和特异性结合的DNA序列，决定转录的起始位点和转录效率，原核生物还有-10区和-35区等保守序列。`,topic:`转录与转录调控`,note:`与增强子区分：启动子决定转录起点、位于基因上游且方向固定；增强子不决定起点、位置和方向均可变。`},{id:`mol-0018`,subject:`molecular`,en:`Enhancer`,cn:`增强子`,defCn:`位于基因上游或下游、甚至内含子中，与启动子相距较远但仍能显著提高该基因转录效率的DNA序列，其作用与所处位置和取向无关，通过结合特异转录因子发挥作用。`,topic:`转录与转录调控`,note:``},{id:`mol-0019`,subject:`molecular`,en:`RNA polymerase`,cn:`RNA聚合酶`,defCn:`以DNA为模板，按碱基互补配对原则催化四种核糖核苷三磷酸聚合形成RNA的酶，能直接起始RNA链的合成而无需引物，真核生物有Ⅰ、Ⅱ、Ⅲ三种。`,topic:`转录与转录调控`,note:`与DNA聚合酶区分：RNA聚合酶不需要引物，且具有模板识别、起始、延伸和终止的完整功能。`},{id:`mol-0020`,subject:`molecular`,en:`Transcriptional factor`,cn:`转录因子`,defCn:`能与基因启动子或增强子中的特定DNA序列专一性结合，从而激活或抑制该基因转录的蛋白质，包括通用转录因子和特异转录因子两类。`,topic:`转录与转录调控`,note:``},{id:`mol-0021`,subject:`molecular`,en:`Zinc finger protein`,cn:`锌指蛋白`,defCn:`含有一个或多个由锌离子与半胱氨酸和组氨酸残基配位形成的指状结构域的蛋白质，该结构域能插入DNA双螺旋的大沟与特定序列结合，是最常见的真核转录因子结构类型之一。`,topic:`转录与转录调控`,note:``},{id:`mol-0022`,subject:`molecular`,en:`Operon`,cn:`操纵子`,defCn:`原核生物中功能相关的若干结构基因连同其上游的启动子、操纵基因等调控序列共同组成的转录单位，转录出一条多顺反子mRNA，如乳糖操纵子和色氨酸操纵子。`,topic:`转录与转录调控`,note:`与"基因"区分：操纵子是一个转录调控单元，可包含多个结构基因。`},{id:`mol-0023`,subject:`molecular`,en:`Corepressor`,cn:`辅阻遏物`,defCn:`本身不能直接结合DNA，需与阻遏蛋白结合并使其构象改变后，才能识别并结合操纵基因从而阻断转录的小分子或蛋白质，如色氨酸操纵子中的色氨酸。`,topic:`转录与转录调控`,note:`与诱导物区分：辅阻遏物增强阻遏蛋白与操纵基因的结合（关闭转录），诱导物则使其脱离（开启转录）。`},{id:`mol-0024`,subject:`molecular`,en:`Ribosome`,cn:`核糖体`,defCn:`由rRNA和蛋白质组成的核糖核蛋白颗粒，是细胞内蛋白质合成的场所，由大小两个亚基构成，含有A位点、P位点和E位点三个与tRNA结合的位点。`,topic:`翻译`,note:``},{id:`mol-0025`,subject:`molecular`,en:`Shine-Dalgarno sequence`,cn:`SD序列`,defCn:`原核生物mRNA起始密码子上游约8～13个核苷酸处的一段富含嘌呤的保守序列，能与16S rRNA 3'端互补配对，使核糖体小亚基正确定位到起始密码子处起始翻译。`,topic:`翻译`,note:`真核生物中与之功能对应的是5'帽子结构引导的扫描机制。`},{id:`mol-0026`,subject:`molecular`,en:`Cognate tRNAs`,cn:`同源tRNA`,defCn:`反密码子能与某一特定密码子通过碱基互补配对、并携带与该密码子所编码氨基酸相对应的tRNA，是保证遗传信息准确翻译的关键分子。`,topic:`翻译`,note:``},{id:`mol-0027`,subject:`molecular`,en:`Nonsense codon`,cn:`无义密码子`,defCn:`又称终止密码子，即UAA、UAG和UGA三个密码子，不编码任何氨基酸，而是被释放因子识别，终止多肽链的合成并使新生肽链从核糖体上释放。`,topic:`翻译`,note:`与起始密码子AUG区分。`},{id:`mol-0028`,subject:`molecular`,en:`Nonsense mutation`,cn:`无义突变`,defCn:`编码氨基酸的密码子因碱基替换而突变为终止密码子，导致多肽链在突变位点提前终止合成，产生无功能或功能不全的截短蛋白质的突变。`,topic:`基因突变与修复`,note:`与错义突变、同义突变并列，注意区分三者对蛋白质的影响程度。`},{id:`mol-0029`,subject:`molecular`,en:`Frameshift mutation`,cn:`移码突变`,defCn:`DNA分子中插入或缺失的核苷酸数目不是3的整数倍时，引起突变位点之后阅读框发生改变，使编码的氨基酸序列大幅变化并常提前出现终止密码子的突变。`,topic:`基因突变与修复`,note:``},{id:`mol-0030`,subject:`molecular`,en:`Open reading frame`,cn:`开放阅读框`,defCn:`从起始密码子开始到终止密码子结束、中间不被终止密码子打断、理论上可连续编码一段多肽链的核苷酸序列，常缩写为ORF。`,topic:`基因突变与修复`,note:``},{id:`mol-0031`,subject:`molecular`,en:`Exons`,cn:`外显子`,defCn:`真核生物断裂基因中存在于成熟mRNA分子上的序列，既包括编码蛋白质的序列，也包括5'端和3'端的非翻译区。`,topic:`基因表达调控`,note:`与内含子区分：内含子在mRNA成熟加工过程中被剪接切除。`},{id:`mol-0032`,subject:`molecular`,en:`Alternative splicing`,cn:`可变剪接`,defCn:`同一前体mRNA通过选择不同的剪接位点组合，产生多种不同成熟mRNA、进而翻译出不同蛋白质异构体的过程，是真核生物基因表达调控和蛋白质多样性的重要机制。`,topic:`基因表达调控`,note:`2023年真题中以人载脂蛋白B的两种形式为例考察。`},{id:`mol-0033`,subject:`molecular`,en:`Branch site`,cn:`分支点`,defCn:`真核生物前体mRNA内含子中靠近3'剪接位点的一段保守序列，其中腺苷酸的2'-羟基在剪接第一步中亲核攻击5'剪接位点，形成套索状中间体。`,topic:`基因表达调控`,note:`记忆剪接过程时，分支点腺苷酸的2'-OH是关键。`},{id:`mol-0034`,subject:`molecular`,en:`RNA editing`,cn:`RNA编辑`,defCn:`转录后RNA分子上发生核苷酸的插入、缺失或替换，使成熟RNA的序列与DNA模板不完全一致，从而产生与基因序列不完全对应的蛋白质的现象。`,topic:`基因表达调控`,note:`与RNA剪接区分：剪接是切除内含子连接外显子，编辑是改变单个核苷酸。`},{id:`mol-0035`,subject:`molecular`,en:`LncRNA`,cn:`长链非编码RNA`,defCn:`长度超过200个核苷酸、本身不编码蛋白质的RNA分子，可在转录水平、转录后水平和表观遗传水平通过多种机制调控基因表达，如Xist参与X染色体失活。`,topic:`基因表达调控`,note:`全称 long non-coding RNA，与miRNA、siRNA等小非编码RNA区分。`},{id:`mol-0036`,subject:`molecular`,en:`RNAi`,cn:`RNA干扰`,defCn:`由双链RNA引发的、经Dicer切割生成siRNA并组装成RISC复合体，进而特异性降解同源mRNA或抑制其翻译，使相应基因表达沉默的现象，广泛用于基因功能研究。`,topic:`研究技术与方法`,note:``},{id:`mol-0037`,subject:`molecular`,en:`RISC`,cn:`RNA诱导沉默复合体`,defCn:`RNA干扰途径中由Argonaute蛋白和siRNA或miRNA组装形成的核糖核蛋白复合体，其中siRNA引导复合体通过碱基互补识别靶mRNA，并对其进行切割或抑制翻译。`,topic:`研究技术与方法`,note:`全称 RNA-induced silencing complex，是RNAi的效应器。`},{id:`mol-0038`,subject:`molecular`,en:`Restriction enzyme`,cn:`限制性内切酶`,defCn:`识别双链DNA分子中特定的核苷酸序列（多为4～8bp的回文序列）并在该位点切断磷酸二酯键的酶，是基因工程中切割DNA、构建重组体的基本工具酶。`,topic:`研究技术与方法`,note:``},{id:`mol-0039`,subject:`molecular`,en:`Recombinant DNA Technology`,cn:`重组DNA技术`,defCn:`又称基因工程，指在体外用限制性内切酶切割DNA、用DNA连接酶将不同来源的DNA片段连接成重组分子，再导入宿主细胞中进行复制和表达的技术。`,topic:`研究技术与方法`,note:``},{id:`mol-0040`,subject:`molecular`,en:`CRISPR`,cn:`成簇规律间隔短回文重复序列`,defCn:`原核生物基因组中由短重复序列和间隔序列交替组成的结构，与Cas蛋白配合可识别并切割外源核酸，构成细菌的适应性免疫系统，现已被改造为高效、精准的基因编辑工具。`,topic:`研究技术与方法`,note:`全称 clustered regularly interspaced short palindromic repeats。考法上常要求说明Cas9的切割机制。`},{id:`mol-0041`,subject:`molecular`,en:`Nested PCR`,cn:`巢式PCR`,defCn:`先后用两对引物进行两轮PCR扩增，第一轮扩增的产物作为第二轮扩增模板，第二轮引物位于第一轮扩增片段内部，从而显著提高反应特异性和灵敏度的技术。`,topic:`研究技术与方法`,note:`与普通PCR的区别在于引物对被使用两次、扩增片段嵌套。`},{id:`mol-0042`,subject:`molecular`,en:`Western blot`,cn:`蛋白质免疫印迹`,defCn:`将蛋白质样品经凝胶电泳按分子量分离后转移到固相膜上，再用特异性抗体与之结合并通过显色或发光进行检测的技术，可用于分析蛋白质的表达水平和分子量。`,topic:`研究技术与方法`,note:`与Southern blot（检测DNA）、Northern blot（检测RNA）区分。`},{id:`mol-0043`,subject:`molecular`,en:`Gel electrophoresis`,cn:`凝胶电泳`,defCn:`带电的核酸或蛋白质分子在电场作用下通过凝胶介质泳动，因其所带电荷、分子大小和构象不同而迁移速率不同，从而实现分离和鉴定的技术。`,topic:`研究技术与方法`,note:``},{id:`mol-0044`,subject:`molecular`,en:`RNA immunoprecipitation`,cn:`RNA免疫沉淀`,defCn:`利用针对特定RNA结合蛋白的特异性抗体将蛋白与与之结合的RNA共同沉淀下来，再通过测序或定量PCR鉴定这些RNA，从而研究RNA与蛋白质相互作用的技术。`,topic:`研究技术与方法`,note:`与ChIP区分：ChIP沉淀的是与蛋白结合的DNA，RIP沉淀的是RNA。`},{id:`mol-0045`,subject:`molecular`,en:`Proteomics`,cn:`蛋白质组学`,defCn:`在整体水平上研究特定细胞、组织或生物体所表达的全部蛋白质的组成、表达水平、翻译后修饰以及相互作用网络的学科，主要技术手段为双向电泳和质谱。`,topic:`研究技术与方法`,note:``},{id:`mol-0046`,subject:`molecular`,en:`Synonyms`,cn:`同义密码子`,defCn:`编码同一种氨基酸的多个不同密码子，其差别多位于第三位碱基，体现了遗传密码的简并性，可降低突变对蛋白质结构的影响。`,topic:`翻译`,note:`2023年真题卷面写作 "Synonyms"，规范写法为 synonymous codons，答题时建议写全。`},{id:`mol-0047`,subject:`molecular`,en:`Telomere`,cn:`端粒`,defCn:`真核生物染色体末端由高度重复的短序列（人类为TTAGGG）与特异性蛋白结合形成的特殊结构，可保护染色体末端不被降解和融合，并随细胞分裂逐渐缩短。`,topic:`染色体与DNA`,note:`2022年简答题考过"端粒和端粒酶的功能，端粒最初在什么生物中发现"。`},{id:`mol-0048`,subject:`molecular`,en:`Reverse transcriptase`,cn:`反转录酶`,defCn:`以RNA为模板、以四种脱氧核糖核苷三磷酸为底物合成DNA的酶，同时具有RNA酶H活性和DNA聚合酶活性，是反转录病毒和端粒酶发挥作用的必需酶。`,topic:`染色体与DNA`,note:`中心法则的补充内容之一（RNA→DNA），中考常与端粒酶联系考察。`},{id:`mol-0049`,subject:`molecular`,en:`Ribozyme`,cn:`核酶`,defCn:`具有催化活性的RNA分子，能够催化自身或异体RNA的切割、连接等反应，如Ⅰ型和Ⅱ型内含子以及核糖体大亚基中的rRNA，是RNA具有生物学功能多样性的重要证据。`,topic:`基因表达调控`,note:``},{id:`mol-0050`,subject:`molecular`,en:`Spliceosome`,cn:`剪接体`,defCn:`由snRNA（U1、U2、U4、U5、U6）和多种蛋白质组装成的核糖核蛋白复合体，通过识别5'和3'剪接位点及分支点，催化前体mRNA中内含子的切除和外显子的连接。`,topic:`基因表达调控`,note:`2023年简答题涉及Ⅰ型与Ⅱ型内含子的自剪接，注意与剪接体介导的剪接相区分。`},{id:`mol-0051`,subject:`molecular`,en:`Riboswitch`,cn:`核糖开关`,defCn:`位于mRNA非翻译区、能够直接结合特定小分子代谢物并因此改变自身构象，从而调控基因转录终止或翻译起始的RNA元件，是细菌中重要的基因表达调控方式。`,topic:`基因表达调控`,note:`2023年简答题专门考过其结构和作用机制。`},{id:`mol-0052`,subject:`molecular`,en:`Genetic code`,cn:`遗传密码`,defCn:`mRNA分子中由三个相邻核苷酸组成一个密码子、对应一种氨基酸的编码规则，具有连续性、简并性、通用性和方向性等特点，共有64个密码子。`,topic:`翻译`,note:`2026年简答题考过"遗传密码的特点和简并性的生物学意义"。`},{id:`mol-0053`,subject:`molecular`,en:`Wobble hypothesis`,cn:`摆动学说`,defCn:`由克里克提出的假说，认为tRNA反密码子中5'端的第一位碱基与mRNA密码子第三位碱基配对时不够严格，可以发生摆动，从而使一种tRNA能识别多个同义密码子。`,topic:`翻译`,note:`这是解释密码子简并性的重要机制，常与遗传密码特点一起考。`},{id:`mol-0054`,subject:`molecular`,en:`Replication fork`,cn:`复制叉`,defCn:`DNA复制时双链解开形成Y形的区域，由解旋酶、单链结合蛋白、引物酶、DNA聚合酶等多种蛋白协同作用，是DNA进行半不连续复制的场所。`,topic:`染色体与DNA`,note:`2026年简答题考过"复制叉的结构与其结合的蛋白"。`},{id:`mol-0055`,subject:`molecular`,en:`Leading strand`,cn:`前导链`,defCn:`DNA复制中沿着复制叉前进方向、以3'→5'方向的母链为模板连续合成的新链，其合成方向为5'→3'，与复制叉移动方向一致。`,topic:`染色体与DNA`,note:`与后随链对比记忆：前导链连续合成，后随链不连续合成并形成冈崎片段。`},{id:`mol-0056`,subject:`molecular`,en:`Histone`,cn:`组蛋白`,defCn:`真核生物染色质中与DNA结合的碱性蛋白质，富含赖氨酸和精氨酸，分为H1、H2A、H2B、H3、H4五类，其中H2A、H2B、H3、H4各两分子构成核小体的八聚体核心。`,topic:`染色体与DNA`,note:`2024年简答题考过组蛋白的类型、修饰类型及生物学意义。`},{id:`mol-0057`,subject:`molecular`,en:`Repressor`,cn:`阻遏蛋白`,defCn:`由调节基因编码、能够识别并特异性结合操纵基因，从而阻断RNA聚合酶与启动子结合、抑制结构基因转录的蛋白质。`,topic:`转录与转录调控`,note:`与辅阻遏物区分：辅阻遏物需与阻遏蛋白结合后才使其具有活性。`},{id:`mol-0058`,subject:`molecular`,en:`Inducer`,cn:`诱导物`,defCn:`能与阻遏蛋白结合并改变其构象、使其从操纵基因上脱落，从而解除阻遏、开启结构基因转录的小分子物质，如乳糖操纵子中的异乳糖。`,topic:`转录与转录调控`,note:`与辅阻遏物作用相反，是乳糖操纵子负控诱导系统的关键。`},{id:`mol-0059`,subject:`molecular`,en:`Sigma factor`,cn:`σ因子`,defCn:`原核生物RNA聚合酶全酶中的一个亚基，能识别启动子的-10区和-35区保守序列，引导RNA聚合酶正确结合到转录起始位点，并在转录起始后脱落。`,topic:`转录与转录调控`,note:`注意区别：核心酶负责延伸，全酶（核心酶＋σ因子）负责起始。`},{id:`mol-0060`,subject:`molecular`,en:`Transposon`,cn:`转座子`,defCn:`基因组中能够从一处移动到另一处、引起遗传重排的可移动DNA序列，由麦克林托克在玉米中发现，分为复制型和非复制型两类，对基因组进化和基因突变具有重要影响。`,topic:`基因突变与修复`,note:``},{id:`mol-0061`,subject:`molecular`,en:`DNA repair`,cn:`DNA修复`,defCn:`细胞对DNA损伤进行识别并恢复其正常结构的各种机制的总称，主要包括光复活修复、切除修复、错配修复和重组修复等，是维持基因组稳定性的重要保障。`,topic:`基因突变与修复`,note:``},{id:`mol-0062`,subject:`molecular`,en:`Chromatin remodeling`,cn:`染色质重塑`,defCn:`在ATP供能的染色质重塑复合体作用下，通过改变核小体的位置、组成或结构，使染色质在疏松与紧密状态之间转换，从而调控基因转录可及性的过程。`,topic:`基因表达调控`,note:`与组蛋白修饰共同构成基因转录的表观遗传调控层面。`},{id:`mol-0063`,subject:`molecular`,en:`Plasmid`,cn:`质粒`,defCn:`细菌细胞内独立于染色体之外、能自主复制的共价闭合环状双链DNA分子，常携带抗生素抗性等基因，是基因工程中最常用的载体。`,topic:`研究技术与方法`,note:`答"质粒作为载体应具备的条件"是常见延伸考点。`},{id:`mol-0064`,subject:`molecular`,en:`Transformation`,cn:`转化`,defCn:`细菌从周围环境中直接摄取游离的DNA片段，并将其整合到自身基因组中从而获得新的遗传性状的过程，是基因工程中把重组质粒导入宿主细胞的关键步骤。`,topic:`研究技术与方法`,note:`与转导、接合区分：转化靠摄取游离DNA，转导靠噬菌体介导，接合靠细胞直接接触。`},{id:`mol-0065`,subject:`molecular`,en:`cDNA library`,cn:`cDNA文库`,defCn:`以某种细胞或组织中的全部mRNA为模板，经反转录合成cDNA并克隆到载体中构建成的文库，只包含该组织在特定条件下表达的基因，不含内含子。`,topic:`研究技术与方法`,note:`与基因组文库对比记：cDNA文库反映表达情况、无内含子；基因组文库包含全部基因、有内含子。`},{id:`mol-0066`,subject:`molecular`,en:`Genomic library`,cn:`基因组文库`,defCn:`将某种生物的全部基因组DNA用限制性内切酶切割后克隆到载体中构建成的文库，包含该生物的全部遗传信息，既有编码序列也有内含子和非编码序列。`,topic:`研究技术与方法`,note:`2022年真题实验设计题涉及"如何获得基因的全长cDNA"，需区分两种文库。`},{id:`mol-0067`,subject:`molecular`,en:`Polymerase chain reaction`,cn:`聚合酶链式反应`,defCn:`在体外利用DNA聚合酶、一对特异性引物和四种dNTP，通过变性、退火、延伸三个步骤的循环反复进行，使目标DNA片段以指数方式扩增的技术。`,topic:`研究技术与方法`,note:`缩写 PCR。注意它不在真题名词解释里出现过，但2025年简答题考过其原理与关键组分，极可能改为名词解释。`},{id:`mol-0068`,subject:`molecular`,en:`Primer`,cn:`引物`,defCn:`一段短的寡核苷酸链，其3'-羟基末端为DNA聚合酶提供起始合成位点，在体内由引物酶合成，在PCR中由人工设计合成，决定扩增产物的特异性。`,topic:`研究技术与方法`,note:``},{id:`mol-0069`,subject:`molecular`,en:`Site-directed mutagenesis`,cn:`定点突变`,defCn:`在已知DNA序列的基础上，通过人工设计引物在特定位点引入碱基的替换、插入或缺失，从而定向改变基因序列并研究其功能的技术。`,topic:`研究技术与方法`,note:``},{id:`mol-0070`,subject:`molecular`,en:`Yeast two-hybrid`,cn:`酵母双杂交`,defCn:`将待测蛋白分别与转录因子的DNA结合结构域和转录激活结构域融合表达，若两种蛋白相互作用则使结构域靠近并激活报告基因表达，从而检测蛋白质间相互作用的技术。`,topic:`研究技术与方法`,note:`2022年真题实验设计题专门考过其原理和应用。`},{id:`mol-0071`,subject:`molecular`,en:`Chromatin immunoprecipitation`,cn:`染色质免疫沉淀`,defCn:`用甲醛交联细胞内蛋白质与DNA的结合，再超声打断染色质、用特异性抗体沉淀目标蛋白-DNA复合物，最后解交联并对回收的DNA进行鉴定，从而确定蛋白质在基因组上结合位点的技术。`,topic:`研究技术与方法`,note:`缩写 ChIP。与RIP区分：ChIP沉淀的是与蛋白结合的DNA，RIP沉淀的是RNA。`},{id:`mol-0072`,subject:`molecular`,en:`Gene knockout`,cn:`基因敲除`,defCn:`利用同源重组或CRISPR-Cas9等技术使生物体基因组中的特定基因功能失活，从而研究该基因功能的实验方法。`,topic:`研究技术与方法`,note:`2026年论述题考过"CRISPR-Cas9敲除基因的分子机制"及如何检验敲除成功。`},{id:`mol-0073`,subject:`molecular`,en:`5' cap`,cn:`5'帽子结构`,defCn:`真核生物成熟mRNA 5'端通过不寻常的5'-5'磷酸二酯键连接的一分子7-甲基鸟苷，具有保护mRNA免遭降解、协助核糖体识别并起始翻译以及参与出核运输的作用。`,topic:`基因表达调控`,note:`2024年简答题考过"真核原始转录产物必须经过哪些加工才能成为成熟mRNA"，帽子是第一个加工事件。`},{id:`mol-0074`,subject:`molecular`,en:`Poly(A) tail`,cn:`多聚腺苷酸尾`,defCn:`真核生物前体mRNA在3'端经切割和多聚腺苷酸化反应加上的由约200个腺苷酸组成的尾，可提高mRNA的稳定性、协助其出核并起始翻译。`,topic:`基因表达调控`,note:``},{id:`mol-0075`,subject:`molecular`,en:`Untranslated region`,cn:`非翻译区`,defCn:`成熟mRNA分子中位于编码区两侧、不被翻译成蛋白质的序列，5'端称5'-UTR、3'端称3'-UTR，含有调控翻译效率和mRNA稳定性的顺式作用元件。`,topic:`基因表达调控`,note:`缩写 UTR。2023年论述题要求画出5'-UTR、3'-UTR、CDS等元件的关系图。`},{id:`mol-0076`,subject:`molecular`,en:`Protein kinase`,cn:`蛋白激酶`,defCn:`催化ATP的γ-磷酸基团转移到蛋白质特定氨基酸残基（丝氨酸、苏氨酸或酪氨酸）上的酶，是细胞内信号转导和代谢调节中最普遍的共价修饰方式。`,topic:`研究技术与方法`,note:`2026年论述题以蛋白激酶为核心设计实验，注意其与磷酸酶共同构成可逆磷酸化调节。`}],f=c([...u,...d,...l],`bundled glossary`);function p(e){return`${e.subject}:${e.en.toLowerCase()}`}function m(e,t){let n=new Set(e.map(p)),r=new Set(n),i=[],a=[];for(let e of t){let t=p(e);if(r.has(t)){a.push(e);continue}r.add(t),i.push(e)}return{terms:[...e,...i],shadowed:a}}var ee=[`英文`,`中文名`,`中文释义`,`主题`,`备注`],te=[`endoplasmic reticulum | 内质网 | 由单层膜围成的管状和囊状结构组成的细胞器，是蛋白质与脂质合成的场所。 | 内膜系统 | 可选备注`].join(`
